name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Cache nix store
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: nix flake check (no build)
        run: nix flake check --no-build --show-trace

      - name: Evaluate framework toplevel
        run: |
          nix eval \
            .#nixosConfigurations.framework.config.system.build.toplevel.drvPath \
            --raw --show-trace

      - name: Evaluate workstation toplevel
        run: |
          nix eval \
            .#nixosConfigurations.workstation.config.system.build.toplevel.drvPath \
            --raw --show-trace

      - name: Evaluate server toplevel
        run: |
          nix eval \
            .#nixosConfigurations.server.config.system.build.toplevel.drvPath \
            --raw --show-trace

      # Evaluation does not compile the pinned Lix source.
      - name: Build framework lix
        run: |
          nix build \
            --extra-substituters https://cache.lix.systems \
            --extra-trusted-public-keys 'cache.lix.systems:aBnZUw8zA7H35Cz2RyKFVs3H4PlGTLawyY5KRbvJR8o=' \
            --no-link --print-out-paths --show-trace \
            '.#nixosConfigurations.framework.config.nix.package'
